name: HealthBridge
options:
  bundleIdPrefix: com.pablo
  deploymentTarget:
    iOS: "16.0"
targets:
  HealthBridge:
    type: application
    platform: iOS
    sources:
      - HealthBridge
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Health Bridge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Health Bridge no lee tus datos de Salud.
        NSHealthUpdateUsageDescription: Health Bridge escribe en Salud los entrenamientos, pasos, sueño y frecuencia cardiaca importados desde tu servidor.
        NSLocalNetworkUsageDescription: Health Bridge se conecta a tu servidor en la red local para descargar tus datos.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Support/HealthBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablo.healthbridgeios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
